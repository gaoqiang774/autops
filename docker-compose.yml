version: '3.8'

services:
  autops:
    build:
      context: .
      dockerfile: Dockerfile
    image: autops:latest
    container_name: autops-app
    restart: unless-stopped
    ports:
      - "9020:3000"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=140.100.180.88
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=autops
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
